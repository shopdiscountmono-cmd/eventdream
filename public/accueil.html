<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>EventDream — Location de matériel événementiel à Villejuif</title>
  <meta name="description" content="Location de mobilier, vaisselle et décoration événementielle à Villejuif (94). Mariages, anniversaires, henné, baptêmes. Devis gratuit en ligne."/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
    :root{--cream:#FBF6EF;--panel:#F3E9DE;--ink:#3A2E26;--muted:#8A7A6D;--gold:#B8935A;--border:#E4D8C8}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',-apple-system,sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased}
    .serif{font-family:'Cormorant Garamond',serif}
    a{color:inherit}
    img{max-width:100%}
    .wrap{max-width:560px;margin:0 auto}
    @media (min-width:700px){.wrap{max-width:900px}}
    @media (min-width:1100px){.wrap{max-width:1080px}}

    .topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;max-width:1080px;margin:0 auto}
    .topbar .logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;letter-spacing:.08em}
    .lang-btn{background:#fff;border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--muted)}

    .hero{position:relative;width:100%;aspect-ratio:4/5;max-height:640px;overflow:hidden;background:linear-gradient(135deg,var(--panel),var(--cream))}
    @media (min-width:700px){.hero{aspect-ratio:16/8}}
    .hero video,.hero img{width:100%;height:100%;object-fit:cover;display:block}
    .hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(58,46,38,.75) 0%,rgba(58,46,38,.25) 55%,rgba(58,46,38,.08) 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:32px 20px}
    @media (min-width:700px){.hero-overlay{padding:48px 40px}}
    .hero-title{font-family:'Cormorant Garamond',serif;color:#fff;font-size:36px;font-weight:600;line-height:1.08;max-width:560px}
    @media (min-width:700px){.hero-title{font-size:50px}}
    .hero-sub{color:#F0E6D8;font-size:14px;margin-top:10px;max-width:460px;line-height:1.55}
    .cta-row{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
    .cta-btn{display:inline-block;padding:15px 28px;border-radius:14px;background:var(--gold);color:var(--ink);font-weight:800;font-size:14px;text-decoration:none;letter-spacing:.01em}
    .cta-btn.secondary{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.7);color:#fff;backdrop-filter:blur(4px)}

    .section{padding:44px 20px}
    .section h2{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;text-align:center;margin-bottom:8px}
    .section .rule{width:48px;height:1px;background:var(--gold);margin:0 auto 24px}
    .desc-text{font-size:15px;line-height:1.75;color:var(--muted);text-align:center;max-width:680px;margin:0 auto}

    .why-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px;max-width:640px;margin-left:auto;margin-right:auto}
    @media (min-width:700px){.why-grid{grid-template-columns:repeat(4,1fr)}}
    .why-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px 14px;text-align:center}
    .why-card .ic{font-size:28px;margin-bottom:10px}
    .why-card .lb{font-size:13px;font-weight:700;color:var(--ink)}

    .services-grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:28px}
    @media (min-width:700px){.services-grid{grid-template-columns:1fr 1fr}}
    .service-card{border-radius:18px;overflow:hidden;position:relative;min-height:260px;display:flex;align-items:flex-end}
    .service-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
    .service-card .veil{position:absolute;inset:0;background:linear-gradient(to top,rgba(58,46,38,.82),rgba(58,46,38,.15));z-index:1}
    .service-card .content{position:relative;z-index:2;padding:22px;color:#fff}
    .service-card h3{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;margin-bottom:6px}
    .service-card p{font-size:13px;color:#F0E6D8;line-height:1.5}

    .gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
    @media (min-width:700px){.gallery-grid{grid-template-columns:repeat(3,1fr)}}
    .gallery-item{border-radius:16px;overflow:hidden;position:relative;background:var(--panel)}
    .gallery-item img{width:100%;height:220px;object-fit:cover;display:block}
    .gallery-caption{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to top,rgba(58,46,38,.75),transparent);color:#fff;font-size:12px;font-weight:600;padding:20px 12px 10px}

    .testi-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:24px}
    @media (min-width:700px){.testi-grid{grid-template-columns:repeat(3,1fr)}}
    .testi-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px}
    .testi-stars{color:var(--gold);font-size:14px;margin-bottom:8px}
    .testi-text{font-size:13.5px;color:var(--ink);line-height:1.6;font-style:italic}
    .testi-name{font-size:12px;color:var(--muted);font-weight:700;margin-top:12px}

    .reviews-card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:32px 24px;text-align:center;max-width:480px;margin:28px auto 0}
    .reviews-stars{color:var(--gold);font-size:22px;letter-spacing:2px;margin-bottom:10px}
    .reviews-card p{font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.6}

    .info-grid{display:grid;grid-template-columns:1fr;gap:20px;margin-top:28px}
    @media (min-width:700px){.info-grid{grid-template-columns:1fr 1fr}}
    .info-card{background:#fff;border:1px solid var(--border);border-radius:18px;overflow:hidden}
    .info-card iframe{width:100%;height:220px;border:0;display:block}
    .info-card .body{padding:20px}
    .info-row{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;margin-bottom:12px;color:var(--ink)}
    .info-row .ic{flex-shrink:0;font-size:16px}
    .social-row{display:flex;gap:10px;margin-top:16px}
    .social-btn{flex:1;text-align:center;padding:11px;border-radius:10px;border:1.5px solid var(--border);text-decoration:none;font-size:12.5px;font-weight:700;color:var(--ink)}

    .final-cta{background:var(--ink);border-radius:24px;margin:0 20px;padding:44px 24px;text-align:center}
    .final-cta h2{font-family:'Cormorant Garamond',serif;color:var(--cream);font-size:26px;font-weight:600;margin-bottom:10px}
    .final-cta p{color:#C9B8A3;font-size:13px;margin-bottom:20px}

    .wa-banner-link{display:block;text-align:center;background:#dcfce7;color:#065f46;border-radius:12px;padding:12px 14px;font-size:13px;font-weight:600;text-decoration:none;margin:16px 20px 0}
    .wa-banner-link strong{font-weight:800}
    .footer{text-align:center;padding:16px 20px 4px;font-size:11px;color:#B8A99A}
    body{min-height:100vh}
    html,body{overscroll-behavior-y:none}
    .reveal{opacity:0;transform:translateY(28px);transition:opacity .75s ease,transform .75s ease}
    .reveal.in{opacity:1;transform:none}
    .hero-img.h2.in{opacity:1 !important}
    .hero-img.h1.out{opacity:0 !important}
  </style>

window.toggleLang=()=>{lang=lang==="fr"?"en":"fr";render()};

async function loadData(){
  try{
    const[landingSnap,settingsSnap]=await Promise.all([getDoc(doc(db,"app","landingPage")),getDoc(doc(db,"app","settings"))]);
    landing=landingSnap.exists()?(landingSnap.data().value||{}):{};
    settings=settingsSnap.exists()?(settingsSnap.data().value||{}):{};
  }catch(e){
    // Ne reste JAMAIS bloqué sur le sablier : si la lecture échoue (règles Firestore, réseau...),
    // on affiche quand même une page complète avec les infos réelles ci-dessus en repli.
    console.warn("Chargement du contenu personnalisé impossible, affichage du contenu par défaut :",e.message);
    landing={};settings={};
  }
  render();
}

function waBannerHtml(){
  const tel=(settings.phone||"0652360849").replace(/[^0-9+]/g,"");
  const num=tel.replace(/^0/,"33").replace(/^\+/,"");
  return`<a href="https://wa.me/${num}" target="_blank" rel="noopener" class="wa-banner-link">💬 ${t("wa")} <strong>${settings.phone||"06 52 36 08 49"}</strong></a>`;
}

function escapeHtml(s){
  const d=document.createElement("div");
  d.textContent=s;
  return d.innerHTML;
}

function render(){
  const description=landing.description&&landing.description.trim()?landing.description:t("fallback_desc");
  const phone=settings.phone||"06 52 36 08 49";
  const phoneHref=phone.replace(/[^0-9+]/g,"");

  // Hero : vidéo si téléversée (prioritaire) > sinon alternance douce entre 2 photos réelles
  // (photo de couverture personnalisée si définie, sinon 2 photos du site officiel) — pour donner
  // du mouvement à la page sans dépendre d'une vidéo.
  const useVideo=!!landing.heroVideo;
  const heroImg1=landing.heroImage||REAL.heroPhoto;
  const heroImg2=landing.heroImage?null:REAL.heroPhoto2;

  const hero=`<div class="hero">
    ${useVideo?`<video src="${landing.heroVideo}" autoplay muted loop playsinline></video>`:`
    <img class="hero-img h1" src="${heroImg1}" alt="EventDream" style="position:absolute;inset:0;opacity:1;transition:opacity 1.4s ease"/>
    ${heroImg2?`<img class="hero-img h2" src="${heroImg2}" alt="EventDream" style="position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease"/>`:""}`}
    <div class="hero-overlay">
      <div class="hero-title serif">${t("title1")}<br/>${t("title2")}</div>
      <div class="hero-sub">${escapeHtml(description).split("\n")[0]}</div>
      <div class="cta-row">
        <a href="/devis.html" class="cta-btn">${landing.ctaText||t("cta")} →</a>
        <a href="tel:${phoneHref}" class="cta-btn secondary">📞 ${t("cta2")}</a>
      </div>
    </div>
  </div>`;

  const descSection=`<div class="section reveal"><div class="desc-text">${escapeHtml(description).replace(/\n/g,"<br/>")}</div></div>`;

  const whySection=`<div class="section reveal" style="padding-bottom:0"><div class="why-grid">
    <div class="why-card"><div class="ic">🕐</div><div class="lb">${t("why1")}</div></div>
    <div class="why-card"><div class="ic">💬</div><div class="lb">${t("why2")}</div></div>
    <div class="why-card"><div class="ic">📋</div><div class="lb">${t("why3")}</div></div>
    <div class="why-card"><div class="ic">⚡</div><div class="lb">${t("why4")}</div></div>
  </div></div>`;

  const chips=list=>list.split("|").map(x=>`<span style="display:inline-block;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);border-radius:20px;padding:5px 12px;font-size:11px;color:#fff;margin:3px 4px 0 0">${x}</span>`).join("");
  const servicesSection=`<div class="section reveal">
    <h2 class="serif">${t("services")}</h2><div class="rule"></div>
    <div class="services-grid">
      <a href="/devis.html" class="service-card" style="text-decoration:none">
        <img src="${REAL.mobilierPhoto}"/><div class="veil"></div>
        <div class="content"><h3 class="serif">${t("mobilier_t")}</h3><p>${t("mobilier_d")}</p><div style="margin-top:10px">${chips(t("mobilier_list"))}</div></div>
      </a>
      <a href="/devis.html" class="service-card" style="text-decoration:none">
        <img src="${REAL.decoPhoto}"/><div class="veil"></div>
        <div class="content"><h3 class="serif">${t("deco_t")}</h3><p>${t("deco_d")}</p><div style="margin-top:10px">${chips(t("deco_list"))}</div></div>
      </a>
    </div>
  </div>`;

  const gallery=(landing.gallery&&landing.gallery.length?landing.gallery:REAL.gallery);
  const gallerySection=gallery.length?`<div class="section reveal">
    <h2 class="serif">${t("gallery")}</h2><div class="rule"></div>
    <div class="gallery-grid">${gallery.map(p=>`<div class="gallery-item"><img src="${p.url}" loading="lazy"/>${p.caption?`<div class="gallery-caption">${escapeHtml(p.caption)}</div>`:""}</div>`).join("")}</div>
  </div>`:"";

  const testis=(landing.testimonials||[]).filter(tm=>tm.text);
  const testiSection=testis.length?`<div class="section reveal">
    <h2 class="serif">${t("avis")}</h2><div class="rule"></div>
    <div class="testi-grid">${testis.map(tm=>`<div class="testi-card"><div class="testi-stars">${"★".repeat(tm.rating||5)}</div><div class="testi-text">"${escapeHtml(tm.text)}"</div>${tm.name?`<div class="testi-name">— ${escapeHtml(tm.name)}</div>`:""}</div>`).join("")}</div>
  </div>`:"";

  // Avis Google : lien direct vers la fiche officielle (aucun scraping, 100% conforme) — un import
  // automatique des avis eux-mêmes nécessite une clé API Google Places dédiée, en discussion.
  const reviewsSection=`<div class="section reveal" style="padding-top:0">
    <div class="reviews-card">
      <div class="reviews-stars">★★★★★</div>
      <h2 class="serif" style="font-size:20px;margin-bottom:10px">${t("reviews_title")}</h2>
      <p>${t("reviews_text")}</p>
      <a href="${REAL.reviewsUrl}" target="_blank" rel="noopener" class="cta-btn" style="background:var(--ink);color:var(--cream)">${t("reviews_cta")} →</a>
    </div>
  </div>`;

  const infoSection=`<div class="section reveal">
    <h2 class="serif">${t("infos")}</h2><div class="rule"></div>
    <div class="info-grid">
      <div class="info-card"><iframe src="${REAL.mapsEmbed}" loading="lazy"></iframe></div>
      <div class="info-card"><div class="body">
        <div class="info-row"><span class="ic">📍</span><span>${REAL.address}</span></div>
        <div class="info-row"><span class="ic">🕐</span><span>${t("horaires")} : ${REAL.hours}</span></div>
        <div class="info-row"><span class="ic">📞</span><a href="tel:${phoneHref}">${phone}</a></div>
        <div class="social-row">
          <a href="${REAL.instagram}" target="_blank" rel="noopener" class="social-btn">📷 Instagram</a>
          <a href="${REAL.facebook}" target="_blank" rel="noopener" class="social-btn">👍 Facebook</a>
        </div>
      </div></div>
    </div>
  </div>`;

  const finalCta=`<div class="final-cta reveal">
    <h2 class="serif">${t("final_title")}</h2>
    <p>${t("final_sub")}</p>
    <a href="/devis.html" class="cta-btn">${landing.ctaText||t("cta")} →</a>
  </div>`;

  document.getElementById("app").innerHTML=`<div class="wrap">
    ${hero}
    ${descSection}
    ${whySection}
    ${servicesSection}
    ${gallerySection}
    ${testiSection}
    ${reviewsSection}
    ${infoSection}
    ${finalCta}
    ${waBannerHtml()}
    <div class="footer">EventDream — ${new Date().getFullYear()}</div>
  </div>`;
  if(typeof fbq==="function"){fbq('track','PageView');}
  initReveal();
  initHeroCrossfade();
}

// Fait apparaître chaque section en fondu + léger glissement au fur et à mesure du défilement
// (au lieu de tout afficher d'un bloc statique) — donne du mouvement à la page sans dépendre de
// contenu supplémentaire.
function initReveal(){
  const els=document.querySelectorAll(".reveal");
  if(!("IntersectionObserver" in window)){ els.forEach(el=>el.classList.add("in")); return; }
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); obs.unobserve(e.target); } });
  },{threshold:0.12});
  els.forEach(el=>obs.observe(el));
}

// Alterne doucement entre 2 photos réelles dans le hero (toutes les 5s) tant qu'aucune vidéo
// n'est en place — la page respire un peu plus qu'avec une seule image fixe.
let heroTimer=null;
function initHeroCrossfade(){
  clearInterval(heroTimer);
  const h1=document.querySelector(".hero-img.h1"),h2=document.querySelector(".hero-img.h2");
  if(!h1||!h2)return;
  let toggled=false;
  heroTimer=setInterval(()=>{
    toggled=!toggled;
    h1.classList.toggle("out",toggled);
    h2.classList.toggle("in",toggled);
  },5000);
}

loadData();
</script>
