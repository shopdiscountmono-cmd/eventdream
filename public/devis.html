async function loadData(){
  const[stockSnap,settingsSnap]=await Promise.all([getDocs(collection(db,"stock")),getDoc(doc(db,"app","settings"))]);
  stockItems=stockSnap.docs.map(d=>({...d.data(),id:d.id})).filter(s=>s.name&&(s.price||0)>0);
  settings=settingsSnap.exists()?(settingsSnap.data().value||settingsSnap.data()||{}):{};
  activeCat=[...new Set(stockItems.map(s=>s.category).filter(Boolean))].sort()[0]||"";
  renderWaBanner();
  render();
}

// Bandeau "Nous contacter sur WhatsApp" : affiché en permanence au-dessus du formulaire, sur les
// 4 étapes — pour qu'un client pressé ou hésitant puisse joindre l'équipe directement.
function renderWaBanner(){
  const el=document.getElementById("wa-banner");
  if(!el)return;
  const tel=(settings.phone||"").replace(/[^0-9+]/g,"");
  if(!tel){el.innerHTML="";return;}
  const num=tel.replace(/^0/,"33").replace(/^\+/,"");
  el.innerHTML=`<a href="https://wa.me/${num}" target="_blank" rel="noopener" class="wa-banner-link">💬 ${t("wa_contact")} <strong>${settings.phone}</strong></a>`;
}

async function computeDistance(origin,dest){
  if(!MAPS_KEY||!origin||!dest)return null;
  try{
    const resp=await fetch("https://routes.googleapis.com/distanceMatrix/v2:computeRouteMatrix",{
      method:"POST",headers:{"Content-Type":"application/json","X-Goog-Api-Key":MAPS_KEY,"X-Goog-FieldMask":"originIndex,destinationIndex,duration,distanceMeters,condition"},
      body:JSON.stringify({origins:[{waypoint:{address:origin}}],destinations:[{waypoint:{address:dest}}],travelMode:"DRIVE"})
    });
    if(!resp.ok)return null;
    const data=await resp.json();
    const el=Array.isArray(data)?data[0]:data;
    if(el&&el.condition==="ROUTE_EXISTS"&&el.distanceMeters!=null){
      const sec=parseInt(String(el.duration).replace("s",""))||0;
      return{km:Math.round(el.distanceMeters/100)/10,min:Math.round(sec/60)};
    }
  }catch(e){}
  return null;
}

// ─── Calculs de prix ───
function calcTrajetUnit(){
  const s=settings,km=form.deliveryKm,min=form.deliveryMin;
  if(km<=0)return 0;
  const forfait=s.minDeliveryPrice||0;
  const seuilKm=s.seuilKm!=null?s.seuilKm:5;
  const seuilMin=s.seuilMin!=null?s.seuilMin:0;
  return forfait+Math.max(0,km-seuilKm)*(s.pricePerKm||0)+Math.max(0,min-seuilMin)*(s.pricePerMin||0);
}
function calcBase(){
  const u=calcTrajetUnit();
  return(form.trajetAller?u:0)+(form.trajetRetour?u:0);
}
function effEtages(){
  const e=parseInt(form.etage);
  return isNaN(e)||e<1?1:e;
}
function calcEtage(){
  const baremes=settings.deliveryEtageBaremes||{};
  const parEtage=Object.entries(form.items).filter(([,q])=>q>0).reduce((s,[id,qty])=>{
    const cfg=baremes[id];
    if(!cfg||!cfg.batchSize)return s;
    return s+Math.ceil(qty/(parseFloat(cfg.batchSize)||1))*(parseFloat(cfg.price)||0);
  },0);
  return parEtage*effEtages();
}
function calcInstall(){
  const baremes=settings.deliveryMiseEnPlaceBaremes||{};
  return Object.entries(form.items).filter(([,q])=>q>0).reduce((s,[id,qty])=>{
    const cfg=baremes[id];
    if(!cfg||!cfg.unitPrice)return s;
    return s+(parseFloat(cfg.unitPrice)||0)*qty;
  },0);
}
function calcDelivery(){
  if(form.mode!=="livraison")return 0;
  const base=calcBase();
  if(form.niveau==="pied")return base;
  if(form.niveau==="porte")return base+calcEtage();
  if(form.niveau==="installation")return base+calcEtage()+calcInstall();
  return base;
}
function delLabel(){
  if(form.niveau==="installation")return"🛠️ "+t("niv_install");
  if(form.niveau==="porte")return"🚪 "+t("niv_porte");
  return"🚚 "+t("niv_pied");
}
function calcSubtotal(){
  return Object.entries(form.items).reduce((s,[id,qty])=>{
    const item=stockItems.find(i=>i.id===id);
    if(!item||qty<=0)return s;
    const wash=form.options[id+"_washing"]?(parseFloat(item.cleaningPrice)||0)*qty:0;
    return s+(parseFloat(item.price)||0)*qty+wash;
  },0);
}
function calcTotal(){return calcSubtotal()+calcDelivery()}
function cartCount(){return Object.values(form.items).reduce((s,q)=>s+(q>0?q:0),0)}

// Distance maximale considérée comme une livraison normale.
const MAX_KM=100;

function fullAddress(){
  const rue=(form.rue||"").trim(),cp=(form.cp||"").trim(),ville=(form.ville||"").trim();
  if(!rue||!cp||!ville)return"";
  return`${rue}, ${cp} ${ville}`;
}
const cpValide=()=>/^\d{5}$/.test((form.cp||"").trim());
const adresseComplete=()=>!!(form.rue||"").trim()&&cpValide()&&!!(form.ville||"").trim();

let debounceTimer=null;
let cpLookupTimer=null,cpLookupToken=0;
let villeLookupTimer=null,villeLookupToken=0;
let addrReqToken=0;

window.onAddrField=(champ,val)=>{
  form[champ]=val;
  form.address=fullAddress();
  clearTimeout(debounceTimer);
  const myToken=++addrReqToken;
  if(champ==="cp"){
    clearTimeout(cpLookupTimer);
    if(/^\d{5}$/.test(val)&&!form.ville){
      const myCpToken=++cpLookupToken;
      cpLookupTimer=setTimeout(async()=>{
        try{
          const r=await fetch(`https://geo.api.gouv.fr/communes?codePostal=${val}&fields=nom&format=json`);
          const data=await r.json();
          if(myCpToken!==cpLookupToken)return;
          if(data&&data[0]&&data[0].nom&&!form.ville&&form.cp===val){
            form.ville=data[0].nom;
            const villeInput=document.getElementById("f-ville");
            if(villeInput)villeInput.value=form.ville;
            onAddrField("ville",form.ville);
          }
        }catch(e){}
      },500);
    }
  }
  if(champ==="ville"){
    clearTimeout(villeLookupTimer);
    const villeVal=val.trim();
    if(villeVal.length>=3&&!form.cp){
      const myVilleToken=++villeLookupToken;
      villeLookupTimer=setTimeout(async()=>{
        try{
          const r=await fetch(`https://geo.api.gouv.fr/communes?nom=${encodeURIComponent(villeVal)}&fields=nom,codesPostaux&boost=population&limit=1`);
          const data=await r.json();
          if(myVilleToken!==villeLookupToken)return;
          const codes=data&&data[0]&&data[0].codesPostaux;
          if(Array.isArray(codes)&&codes.length===1&&!form.cp&&form.ville===villeVal){
            form.cp=codes[0];
            const cpInput=document.getElementById("f-cp");
            if(cpInput)cpInput.value=form.cp;
            onAddrField("cp",form.cp);
          }
        }catch(e){}
      },500);
    }
  }
  if(!adresseComplete()){
    form.addrStatus="incomplete";form.deliveryKm=0;form.deliveryMin=0;
    updateAddrStatusDom();
    return;
  }
  form.addrStatus="checking";
  updateAddrStatusDom();
  debounceTimer=setTimeout(async()=>{
    const res=await computeDistance(settings.warehouseAddress||"",form.address);
    if(myToken!==addrReqToken)return;
    if(res&&res.km>MAX_KM){form.deliveryKm=0;form.deliveryMin=0;form.addrStatus="horszone";}
    else if(res){form.deliveryKm=res.km;form.deliveryMin=res.min;form.addrStatus="ok";}
    else{form.deliveryKm=0;form.deliveryMin=0;form.addrStatus="error";}
    render();
  },900);
};

function addrStatusLabel(){
  if(form.addrStatus==="checking")return{text:"📍 "+t("calcul"),color:"#94a3b8"};
  if(form.addrStatus==="ok")return{text:`✅ ${form.ville.trim()} — ${t("s4")==="Récapitulatif"?"adresse validée":"address validated"}`,color:"#10b981"};
  if(form.addrStatus==="horszone")return{text:"📍 "+t("hors_zone"),color:"#B8935A"};
  if(form.addrStatus==="error")return{text:"⚠️ "+t("addr_err"),color:"#B8935A"};
  if(form.addrStatus==="incomplete")return{text:"✍️ "+t("addr_incomplete"),color:"#94a3b8"};
  return{text:"",color:"#94a3b8"};
}
function updateAddrStatusDom(){
  const el=document.getElementById("addr-status");
  if(!el)return;
  const{text,color}=addrStatusLabel();
  el.textContent=text;el.style.color=color;
}

// ─── Disponibilité (catalogue) ───
// Interroge une Cloud Function dédiée qui ne renvoie QUE des quantités agrégées par article —
// jamais de données clients — pour ne pas exposer publiquement le contenu des commandes en
// cours. Le calcul (commandes actives qui chevauchent la période choisie) est fait côté serveur.
async function fetchAvailability(){
  availabilityLoading=true;render();
  try{
    const res=await httpsCallable(fns,"getStockAvailability")({start:form.date,end:form.returnDate||form.date});
    availability=(res.data&&res.data.availability)||{};
    availabilityLoaded=true;
    Object.keys(form.items).forEach(id=>{
      const max=availability[id];
      if(max!=null&&form.items[id]>max)form.items[id]=max;
    });
  }catch(e){
    console.warn("Vérification de disponibilité indisponible :",e.message);
    availabilityLoaded=false;
  }
  availabilityLoading=false;
  render();
}
function maxQtyFor(id){
  if(!availabilityLoaded)return Infinity;
  const a=availability[id];
  return a==null?Infinity:a;
}
function dispoLineHtml(id,qty){
  const max=maxQtyFor(id);
  if(!availabilityLoaded||max===Infinity)return"";
  if(max<=0)return`<div class="dispo-line max">${t("dispo_indispo")}</div>`;
  if(qty>=max)return`<div class="dispo-line max">${t("dispo_max")}${max}</div>`;
  return`<div class="dispo-line">${max}${t("dispo_ok")}${max>1?"s":""}</div>`;
}

function setQtyClamped(id,qty){
  const max=maxQtyFor(id);
  const clamped=Math.max(0,max===Infinity?qty:Math.min(qty,max));
  form.items[id]=clamped;
  render();
}
window.incQty=id=>setQtyClamped(id,(form.items[id]||0)+1);
window.decQty=id=>setQtyClamped(id,(form.items[id]||0)-1);
window.setQty=setQtyClamped;
window.openDetail=id=>{detailItem=id;render();};
window.closeDetail=()=>{detailItem=null;render();};
window.selectCat=c=>{activeCat=c;render();};
window.toggleOpt=(k,v)=>{form.options[k]=v;render()};

function renderDetailSheet(id){
  const item=stockItems.find(s=>s.id===id);
  if(!item)return"";
  const qty=form.items[id]||0;
  const max=maxQtyFor(id);
  const washPrice=parseFloat(item.cleaningPrice)||0;
  const thumb=item.imageUrl?`<img src="${item.imageUrl}" class="sheet-photo"/>`:`<div class="sheet-photo sheet-photo-fallback">${item.icon||"📦"}</div>`;
  return`<div class="sheet-backdrop" onclick="closeDetail()">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      ${thumb}
      <div class="sheet-name serif">${item.name}</div>
      <div class="sheet-rule"></div>
      <div class="sheet-price">${item.price.toFixed(2)} € <span>/ ${item.unit||"unité"}</span></div>
      ${dispoLineHtml(id,qty)}
      <div class="sheet-qty">
        <button class="qty-btn minus big" onclick="decQty('${id}')" ${qty<=0?"disabled":""}>−</button>
        <input type="number" inputmode="numeric" class="qty-input big" value="${qty}" min="0" onchange="setQty('${id}',parseInt(this.value)||0)"/>
        <button class="qty-btn plus big" onclick="incQty('${id}')" ${max!==Infinity&&qty>=max?"disabled":""}>+</button>
      </div>
      ${qty>0&&washPrice>0?`<label class="opt-cb"><input type="checkbox" ${form.options[id+"_washing"]?"checked":""} onchange="toggleOpt('${id}_washing',this.checked)"/><span class="box"></span>🧺 ${t("washing")} +${washPrice.toFixed(2)} €/u</label>`:""}
      <button class="sheet-close-btn" onclick="closeDetail()">${t("continue_shopping")}</button>
    </div>
  </div>`;
}

function render(){
  // Le catalogue profite d'un conteneur plus large sur tablette/desktop (plus de colonnes
  // visibles) ; les étapes formulaire (dates, coordonnées, récap) restent à une largeur de
  // lecture confortable — des champs de saisie étirés sur toute la largeur d'un écran large
  // seraient inconfortables à utiliser.
  const wrapEl=document.getElementById("wrap");
  if(wrapEl)wrapEl.classList.toggle("wide",step===2);
  const steps=[t("s1"),t("s2"),t("s3"),t("s4")];
  const bar=`<div class="step-bar">${steps.map((_,i)=>`<div class="${i<step-1?"done":i===step-1?"active":""}"></div>`).join("")}</div>`;

  // ── ÉTAPE 1 : Date & Livraison ──
  if(step===1){
    document.getElementById("app").innerHTML=`${bar}
    <div class="card"><h2>📅 ${t("s1")}</h2>
      <label>${t("date")} *</label>
      <input id="f-date" type="date" value="${form.date}" min="${TODAY}" onchange="onDateChange(this.value)"/>
      <label>${t("retDate")}</label>
      <input id="f-retdate" type="date" value="${form.returnDate}" min="${nextDay(form.date)}" onchange="onRetDateChange(this.value)"/>

      <label>Mode *</label>
      <div class="mode-grid">
        <button class="mode-card${form.mode==="livraison"?" sel":""}" onclick="setMode('livraison')"><div class="ic">🚚</div><div class="lb">${t("mode_liv")}</div></button>
        <button class="mode-card${form.mode==="retrait"?" sel":""}" onclick="setMode('retrait')"><div class="ic">🏠</div><div class="lb">${t("mode_ret")}</div></button>
      </div>

      ${form.mode==="livraison"?`
        <label>${t("address")} *</label>
        <input id="f-rue" value="${form.rue}" placeholder="${t("rue")}" autocomplete="street-address" oninput="onAddrField('rue',this.value)" style="margin-bottom:8px"/>
        <div class="addr-grid">
          <input id="f-cp" value="${form.cp}" placeholder="${t("cp")}" inputmode="numeric" maxlength="5" autocomplete="postal-code" oninput="onAddrField('cp',this.value)" style="margin-bottom:4px"/>
          <input id="f-ville" value="${form.ville}" placeholder="${t("ville")}" autocomplete="address-level2" oninput="onAddrField('ville',this.value)" style="margin-bottom:4px"/>
        </div>
        <div id="addr-status" style="font-size:12px;font-weight:700;color:${addrStatusLabel().color};margin-bottom:16px">${addrStatusLabel().text}</div>

        <label>${t("trajet")}</label>
        <div class="trajet-row">
          <button class="trajet-btn${form.trajetAller&&!form.trajetRetour?" sel":""}" onclick="setTrajet(true,false)">${t("aller")}</button>
          <button class="trajet-btn${form.trajetAller&&form.trajetRetour?" sel":""}" onclick="setTrajet(true,true)">${t("allerRetour")}</button>
        </div>

        <label>Niveau de service *</label>
        <div class="niveau-list">
          <button class="niveau-card${form.niveau==="pied"?" sel":""}" onclick="setNiveau('pied')">
            <div class="ic">🚚</div>
            <div class="info"><div class="ttl">${t("niv_pied")}</div><div class="sub">${t("niv_pied_sub")}</div></div>
          </button>
          <button class="niveau-card${form.niveau==="porte"?" sel":""}" onclick="setNiveau('porte')">
            <div class="ic">🚪</div>
            <div class="info"><div class="ttl">${t("niv_porte")}</div><div class="sub">${t("niv_porte_sub")}</div></div>
          </button>
          <button class="niveau-card${form.niveau==="installation"?" sel":""}" onclick="setNiveau('installation')">
            <div class="ic">🛠️</div>
            <div class="info"><div class="ttl">${t("niv_install")}</div><div class="sub">${t("niv_install_sub")}</div></div>
          </button>
        </div>

        ${form.niveau!=="pied"?`
        <div class="etage-row">
          <span>🪜 ${t("etage_q")}</span>
          <input type="number" inputmode="numeric" min="0" value="${form.etage}" placeholder="0" onchange="onEtageChange(this.value)"/>
          <span style="font-size:11px;color:var(--muted)">${t("etage_hint")}</span>
        </div>`:""}
      `:""}
      <div id="err1" class="err" style="display:none"></div>
      <div class="nav-btns"><button class="next-btn" style="flex:1" onclick="goStepCatalogue()">${t("next")} →</button></div>
    </div>`;
  }

  // ── ÉTAPE 2 : Catalogue ──
  else if(step===2){
    const cats=[...new Set(stockItems.map(s=>s.category).filter(Boolean))].sort();
    if(!activeCat||!cats.includes(activeCat))activeCat=cats[0]||"";
    const itemsInCat=stockItems.filter(s=>s.category===activeCat);
    const count=cartCount(),subtotal=calcSubtotal();

    const chips=cats.map(c=>`<button class="cat-chip${c===activeCat?" sel":""}" onclick="selectCat('${c.replace(/'/g,"\\'")}')">${c}</button>`).join("");

    const cards=itemsInCat.map(item=>{
      const qty=form.items[item.id]||0;
      const max=maxQtyFor(item.id);
      const thumb=item.imageUrl?`<img src="${item.imageUrl}" class="prod-photo"/>`:`<div class="prod-photo prod-photo-fallback">${item.icon||"📦"}</div>`;
      return`<div class="prod-card">
        <div onclick="openDetail('${item.id}')" style="cursor:pointer">
          ${thumb}
          <div class="prod-info">
            <div class="prod-name">${item.name}</div>
            <div class="prod-price">${item.price.toFixed(2)} € <span>/ ${item.unit||"unité"}</span></div>
          </div>
        </div>
        <div class="prod-qty">
          <button class="qty-btn minus" onclick="decQty('${item.id}')" ${qty<=0?"disabled":""}>−</button>
          <input type="number" inputmode="numeric" class="qty-input" value="${qty}" min="0" onclick="event.stopPropagation()" onchange="setQty('${item.id}',parseInt(this.value)||0)"/>
          <button class="qty-btn plus" onclick="incQty('${item.id}')" ${max!==Infinity&&qty>=max?"disabled":""}>+</button>
        </div>
        ${dispoLineHtml(item.id,qty)}
      </div>`;
    }).join("");

    document.getElementById("app").innerHTML=`${bar}
    <div class="card" style="${count>0?"padding-bottom:26px":""}">
      <h2>🛍️ ${t("s2")}</h2>
      ${availabilityLoading?`<div class="dispo-checking">⏳ ${t("verif_dispo")}</div>`:""}
      <div class="cat-chips">${chips}</div>
      <div class="prod-grid">${cards||`<div class="empty-cat">${t("empty_cat")}</div>`}</div>
      <div style="margin-top:18px"><label>${t("free_text")}</label><textarea id="f-free" rows="3" placeholder="${t("free_text_ph")}" onblur="saveFree()">${form.freeText||""}</textarea></div>
      <div id="err2" class="err" style="display:none"></div>
      <div class="nav-btns"><button class="back-btn" onclick="goBackTo(1)">← ${t("back")}</button><button class="next-btn" onclick="goStepCoordonnees()">${t("next")} →</button></div>
    </div>
    ${count>0?`<div class="cart-bar" onclick="goStepCoordonnees()">
      <div class="cart-dot left"></div><div class="cart-dot right"></div>
      <div><div class="cart-count">${count} article${count>1?"s":""}</div><div class="cart-total">${subtotal.toFixed(2)} €</div></div>
      <div class="cart-cta">${t("continuer")} →</div>
    </div>`:""}
    ${detailItem?renderDetailSheet(detailItem):""}`;
  }

  // ── ÉTAPE 3 : Coordonnées ──
  else if(step===3){
    document.getElementById("app").innerHTML=`${bar}
    <div class="card"><h2>👤 ${t("s3")}</h2>
      <label>${t("name")} *</label><input id="f-name" value="${form.name}" placeholder="Prénom Nom" autocomplete="name"/>
      <label>${t("phone")} *</label><input id="f-phone" type="tel" value="${form.phone}" placeholder="06 XX XX XX XX" autocomplete="tel"/>
      <label>${t("email")}</label><input id="f-email" type="email" value="${form.email}" placeholder="email@exemple.com" autocomplete="email"/>
      <div id="err3" class="err" style="display:none"></div>
      <div class="nav-btns"><button class="back-btn" onclick="goBackTo(2)">← ${t("back")}</button><button class="next-btn" onclick="goStepRecap()">${t("next")} →</button></div>
    </div>`;
  }

  // ── ÉTAPE 4 : Récapitulatif ──
  else if(step===4){
    const total=calcTotal();
    const del=calcDelivery();
    const selItems=Object.entries(form.items).filter(([,q])=>q>0);
    document.getElementById("app").innerHTML=`${bar}
    <div class="card"><h2 class="serif">📋 ${t("recap")}</h2>
      <div style="margin-bottom:8px;font-size:15px"><strong>${form.name}</strong></div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:2px">${form.phone}${form.email?` · ${form.email}`:""}</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:2px">📅 ${fmtD(form.date)}${form.returnDate?" → "+fmtD(form.returnDate):""}</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:14px">${form.mode==="livraison"?`📍 ${fullAddress()||form.address}`:"🏠 "+t("mode_ret")}</div>
      ${selItems.map(([id,qty])=>{
        const it=stockItems.find(s=>s.id===id);
        if(!it)return"";
        const wash=form.options[id+"_washing"]?(parseFloat(it.cleaningPrice)||0)*qty:0;
        const tot=((parseFloat(it.price)||0)*qty)+wash;
        return`<div class="recap-row"><span>${it.icon||"📦"} ${it.name} ×${qty}${wash>0?" <span style='font-size:11px;color:#0891b2'>+ lavage</span>":""}</span><span style="font-weight:700">${tot.toFixed(2)} €</span></div>`;
      }).join("")}
      ${del>0?`<div class="recap-row"><span>${delLabel()}</span><span style="font-weight:700">${del.toFixed(2)} €</span></div>`:(form.mode==="livraison"&&form.addrStatus!=="ok"?`<div class="recap-row"><span>${delLabel()}</span><span style="font-weight:700;font-size:12px;color:#B8935A">${t("frais_apres")}</span></div>`:"")}
      <div class="recap-total"><span>${t("total")}</span><span>${total.toFixed(2)} €</span></div>
      ${form.freeText?`<div style="background:var(--panel);border-radius:10px;padding:12px;font-size:13px;margin-top:10px">📝 ${form.freeText}</div>`:""}
    </div>
    <div class="card"><h2 class="serif">💰 ${t("acompte")}</h2>
      <div class="acompte-row">
        <button class="acompte-btn${form.acomptePct===30?" sel":""}" onclick="setPct(30)">30%<br><span style="font-size:17px;font-weight:900">${(total*.3).toFixed(2)} €</span></button>
        <button class="acompte-btn${form.acomptePct===100?" sel":""}" onclick="setPct(100)">100%<br><span style="font-size:17px;font-weight:900">${total.toFixed(2)} €</span></button>
      </div>
      <div style="text-align:center;font-size:12px;color:var(--muted)">${t("acompte_note")}</div>
    </div>
    <div id="err4" class="err" style="display:none"></div>
    <button class="submit-btn" id="submit-btn" onclick="submitForm()">✅ ${t("submit")}</button>
    <div class="nav-btns"><button class="back-btn" style="width:100%" onclick="goBackTo(3)">← ${t("back")}</button></div>`;
  }
}

// ── Handlers ──
window.onDateChange=v=>{
  form.date=v;
  if(form.returnDate&&form.returnDate<=v)form.returnDate=nextDay(v);
  render();
};
window.setMode=m=>{
  form.date=document.getElementById("f-date")?.value||form.date;
  form.returnDate=document.getElementById("f-retdate")?.value||form.returnDate;
  form.mode=m;
  render();
};
window.setTrajet=(a,r)=>{
  form.date=document.getElementById("f-date")?.value||form.date;
  form.returnDate=document.getElementById("f-retdate")?.value||form.returnDate;
  form.trajetAller=a;form.trajetRetour=r;render();
};
window.setNiveau=n=>{
  form.date=document.getElementById("f-date")?.value||form.date;
  form.returnDate=document.getElementById("f-retdate")?.value||form.returnDate;
  form.niveau=n;render();
};
window.setPct=p=>{form.acomptePct=p;render()};
window.saveFree=()=>{form.freeText=document.getElementById("f-free")?.value||form.freeText};
window.onRetDateChange=v=>{form.returnDate=v};
window.onEtageChange=v=>{form.etage=v;render()};

function readAddrFields(){
  form.rue=document.getElementById("f-rue")?.value??form.rue;
  form.cp=document.getElementById("f-cp")?.value??form.cp;
  form.ville=document.getElementById("f-ville")?.value??form.ville;
  form.address=fullAddress();
}

window.goBackTo=n=>{
  if(step===2)saveFree();
  step=n;render();
};

// Étape 1 → 2 : valide la date/adresse, puis lance la vérification de disponibilité pour ces dates.
window.goStepCatalogue=()=>{
  form.date=document.getElementById("f-date")?.value||form.date;
  form.returnDate=document.getElementById("f-retdate")?.value||form.returnDate;
  if(form.mode==="livraison")readAddrFields();
  const err=document.getElementById("err1");
  if(!form.date){err.textContent=t("req");err.style.display="block";return;}
  if(form.mode==="livraison"){
    if(!form.rue.trim()||!form.ville.trim()){err.textContent=t("req");err.style.display="block";return;}
    if(!cpValide()){err.textContent=t("cp_err");err.style.display="block";return;}
  }
  if(form.returnDate&&form.returnDate<=form.date){
    form.returnDate=nextDay(form.date);
    render();
    const errAfter=document.getElementById("err1");
    if(errAfter){errAfter.textContent=t("ret_err");errAfter.style.display="block";}
    return;
  }
  step=2;
  availabilityLoaded=false;availability={};
  render();
  fetchAvailability();
};

// Étape 2 → 3 : au moins un article (ou une demande spéciale) doit être renseigné.
window.goStepCoordonnees=()=>{
  saveFree();
  const hasItems=cartCount()>0||form.freeText.trim();
  if(!hasItems){
    const err=document.getElementById("err2");
    if(err){err.textContent=t("select_item_err");err.style.display="block";}
    return;
  }
  step=3;render();
};

// Étape 3 → 4 : coordonnées obligatoires + formats vérifiés.
window.goStepRecap=()=>{
  form.name=document.getElementById("f-name")?.value||"";
  form.phone=document.getElementById("f-phone")?.value||"";
  form.email=document.getElementById("f-email")?.value||"";
  const err=document.getElementById("err3");
  if(!form.name.trim()||!form.phone.trim()){err.textContent=t("req");err.style.display="block";return;}
  const phoneDigits=form.phone.trim().replace(/[\s.\-]/g,"");
  const phoneValide=/^0[1-9]\d{8}$/.test(phoneDigits)||/^(\+33|0033)[1-9]\d{8}$/.test(phoneDigits);
  if(!phoneValide){err.textContent=t("phone_err");err.style.display="block";return;}
  if(form.email.trim()&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.trim())){
    err.textContent=t("email_err");err.style.display="block";return;
  }
  step=4;render();
};

window.submitForm=async()=>{
  const btn=document.getElementById("submit-btn");
  btn.disabled=true;btn.textContent="⏳";
  try{
    const id="web-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,6);
    const items=Object.entries(form.items).filter(([,q])=>q>0).map(([itemId,qty])=>{
      const it=stockItems.find(s=>s.id===itemId);
      return{id:itemId,name:it?.name||itemId,icon:it?.icon||"📦",qty,price:parseFloat(it?.price)||0,category:it?.category||"",cleaningSelected:!!form.options[itemId+"_washing"],cleaningPrice:parseFloat(it?.cleaningPrice)||0};
    });
    const del=calcDelivery();
    await setDoc(doc(db,"orders",id),{
      id,status:"Non confirmé",phase:"livraison",
      clientName:form.name,clientPhone:form.phone,clientEmail:form.email,
      address:fullAddress()||form.address,addressRue:form.rue,addressCp:form.cp,addressVille:form.ville,deliveryMode:form.mode,
      deliveryNiveau:form.niveau,etageClient:form.etage,etageEffectif:form.mode==="livraison"&&form.niveau!=="pied"?effEtages():0,
      trajetAller:form.trajetAller,trajetRetour:form.trajetRetour,
      deliveryDate:form.date,returnDate:form.returnDate,
      deliveryKm:form.deliveryKm,deliveryMin:form.deliveryMin,
      deliveryPriceManual:del>0?String(del):"",
      items,freeTextRequest:form.freeText||"",notes:form.freeText||"",
      acompte:0,acomptePct:form.acomptePct,
      createdAt:new Date().toISOString(),createdBy:"web-client"
    });
    document.getElementById("app").innerHTML=`<div class="card success"><div class="ic">🎉</div><h2 class="serif">${t("ok_title")}</h2><p>${t("ok_text")}</p><a href="/confirm.html?id=${id}" class="consult-link">${t("consult")}</a></div>`;
    window.scrollTo(0,0);
    if(typeof fbq==="function"){fbq('track','Lead');}
    if(form.email&&form.email.trim()){
      try{ await httpsCallable(fns,"sendDevisConfirmationEmail")({orderId:id}); }
      catch(e){ console.warn("Envoi email confirmation devis : échec silencieux :",e.message); }
    }
  }catch(e){
    btn.disabled=false;btn.textContent="✅ "+t("submit");
    const err=document.getElementById("err4");
    err.textContent="Erreur : "+e.message;err.style.display="block";
  }
};

loadData();
</script>
</body>
