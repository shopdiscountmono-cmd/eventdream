<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Demande de devis — EventDream</title>
  <style>
    :root{--navy:#1a1a2e;--blue:#3b82f6;--green:#10b981;--bg:#f6f7f9;--border:#e5e7eb;--text:#1a1a2e;--muted:#6b7280}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);min-height:100vh;color:var(--text);-webkit-font-smoothing:antialiased}
    .wrap{max-width:560px;margin:0 auto;padding:16px 16px 60px}
    .topbar{display:flex;justify-content:flex-end;padding:8px 0}
    .lang-btn{background:#fff;border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--muted)}
    .logo{text-align:center;padding:8px 0 24px}
    .logo h1{font-size:28px;font-weight:900;color:var(--navy);letter-spacing:-0.5px}
    .logo p{font-size:13px;color:var(--muted);margin-top:4px}
    .step-bar{display:flex;gap:6px;margin-bottom:24px}
    .step-bar div{flex:1;height:5px;border-radius:5px;background:var(--border);transition:background .3s}
    .step-bar div.done{background:var(--green)}
    .step-bar div.active{background:var(--blue)}
    .card{background:#fff;border-radius:18px;padding:24px;margin-bottom:16px;box-shadow:0 1px 4px rgba(26,26,46,.05)}
    .card h2{font-size:17px;font-weight:800;margin-bottom:18px;display:flex;align-items:center;gap:8px}
    label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
    input,select,textarea{width:100%;padding:13px 15px;border-radius:12px;border:1.5px solid var(--border);font-size:16px;font-family:inherit;background:#fff;outline:none;margin-bottom:16px;transition:border .15s;-webkit-appearance:none}
    input:focus,textarea:focus{border-color:var(--blue)}
    .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
    .mode-card{padding:16px 12px;border-radius:14px;border:2px solid var(--border);background:#fff;cursor:pointer;text-align:center;transition:all .15s;font-family:inherit}
    .mode-card.sel{border-color:var(--blue);background:#eff6ff}
    .mode-card .ic{font-size:26px;margin-bottom:6px}
    .mode-card .lb{font-size:13px;font-weight:700}
    .niveau-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
    .niveau-card{display:flex;align-items:center;gap:12px;padding:16px;border-radius:14px;border:2px solid var(--border);background:#fff;cursor:pointer;transition:all .15s;font-family:inherit;text-align:left;width:100%}
    .niveau-card.sel{border-color:var(--green);background:#f0fdf4}
    .niveau-card .ic{font-size:24px;flex-shrink:0}
    .niveau-card .info{flex:1;min-width:0}
    .niveau-card .ttl{font-weight:800;font-size:14px}
    .niveau-card .sub{font-size:12px;color:var(--muted);margin-top:2px}
    .niveau-card .prix{font-weight:900;font-size:15px;color:var(--green);flex-shrink:0;white-space:nowrap}
    .addr-grid{display:grid;grid-template-columns:110px 1fr;gap:8px}
    .trajet-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
    .trajet-btn{padding:12px;border-radius:12px;border:2px solid var(--border);background:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center}
    .trajet-btn.sel{border-color:var(--green);background:#f0fdf4;color:#065f46}
    .etage-row{display:flex;align-items:center;gap:12px;background:#f8fafc;border-radius:12px;padding:14px;margin-bottom:16px}
    .etage-row span{font-size:14px;font-weight:600}
    .etage-row input{width:70px;margin:0;text-align:center;font-weight:800}
    .item-row{display:flex;flex-direction:column;gap:8px;padding:13px;background:#f8fafc;border-radius:12px;margin-bottom:8px}
    .item-main{display:flex;align-items:center;gap:10px}
    .item-thumb{width:42px;height:42px;border-radius:10px;object-fit:cover;flex-shrink:0}
    .item-icon{font-size:24px;width:42px;text-align:center;flex-shrink:0;line-height:42px}
    .item-name{font-weight:700;font-size:14px;overflow-wrap:anywhere}
    .qty-ctrl{display:flex;align-items:center;gap:5px;flex-shrink:0}
    .qty-btn{width:32px;height:32px;border-radius:10px;border:none;font-size:17px;font-weight:900;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
    .qty-btn.plus{background:#dcfce7;color:var(--green)}
    .qty-btn.minus{background:#fee2e2;color:#ef4444}
    .qty-input{width:52px;padding:6px 2px;border-radius:10px;border:1.5px solid var(--border);text-align:center;font-size:16px;font-weight:800;font-family:inherit;margin:0}
    .opt-cb{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);cursor:pointer;font-weight:600;background:#fff;border:1px solid var(--border);border-radius:10px;padding:9px 12px;width:100%}
    /* Case à cocher 100% custom : le rendu natif des checkbox reste invisible/blanc sur certains
       iPhone même en restaurant l'apparence. On masque l'input et on dessine notre propre case
       (coche ✓ blanche sur fond vert) — rendu strictement identique sur tous les appareils. */
    .opt-cb input{position:absolute;opacity:0;width:0;height:0;margin:0;padding:0;border:none}
    .opt-cb .box{width:22px;height:22px;border-radius:7px;border:2px solid #cbd5e1;background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff;transition:all .15s}
    .opt-cb input:checked+.box{background:var(--green);border-color:var(--green)}
    .opt-cb input:checked+.box::after{content:"✓"}
    .cat-title{font-size:11px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;margin:16px 0 8px}
    .recap-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f1f5f9;font-size:14px}
    .recap-row:last-of-type{border-bottom:none}
    .recap-total{display:flex;justify-content:space-between;padding:12px 0 4px;font-size:17px;font-weight:900}
    .acompte-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
    .acompte-btn{padding:14px 10px;border-radius:12px;border:2px solid var(--border);background:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
    .acompte-btn.sel{border-color:var(--green);background:#f0fdf4;color:#065f46}
    .submit-btn{width:100%;padding:18px;border-radius:14px;border:none;background:var(--navy);color:#fff;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:.01em}
    .submit-btn:disabled{opacity:.4;cursor:not-allowed}
    .nav-btns{display:flex;gap:10px;margin-top:18px}
    .back-btn{flex:1;padding:14px;border-radius:12px;border:1.5px solid var(--border);background:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--muted)}
    .next-btn{flex:2;padding:14px;border-radius:12px;border:none;background:var(--navy);color:#fff;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
    .err{color:#ef4444;font-size:13px;margin:8px 0;font-weight:700}
    .info-box{background:#eff6ff;border-radius:12px;padding:12px 14px;font-size:13px;color:#1d4ed8;font-weight:600;margin-bottom:16px}
    .success{text-align:center;padding:48px 20px}
    .success .ic{font-size:64px;margin-bottom:16px}
    .success h2{font-size:22px;font-weight:900;color:var(--green);margin-bottom:10px;justify-content:center}
    .success p{color:var(--muted);font-size:14px;line-height:1.6;max-width:340px;margin:0 auto}
  </style>

<body>
<div class="wrap">
  <div class="topbar"><button class="lang-btn" onclick="toggleLang()">🌐 EN / FR</button></div>
  <div class="logo"><h1>EventDream</h1><p id="logo-sub">Demande de devis en ligne</p></div>
  <div id="app"><div style="text-align:center;padding:60px;color:#94a3b8">⏳</div></div>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getFirestore,doc,getDoc,collection,getDocs,setDoc}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyD4WXB0wFeDtakmUC2uUGEeDutKlBuG8cU",authDomain:"eventdream-app.firebaseapp.com",projectId:"eventdream-app",storageBucket:"eventdream-app.firebasestorage.app",messagingSenderId:"881676818782",appId:"1:881676818782:web:77b339331ef984d25fd7cf"};
const db=getFirestore(initializeApp(cfg));
const MAPS_KEY="AIzaSyD4WXB0wFeDtakmUC2uUGEeDutKlBuG8cU";

let lang="fr",step=1,stockItems=[],settings={};
let form={
  name:"",phone:"",email:"",
  // Adresse découpée en 3 champs : sans code postal ni ville, Google résout une rue homonyme
  // dans une autre ville (ex: "19 rue Léon Blum" → plusieurs centaines de km) et les frais
  // calculés deviennent aberrants. On n'interroge l'API qu'une fois les 3 champs remplis.
  rue:"",cp:"",ville:"",address:"",
  mode:"retrait",              // "retrait" | "livraison"
  niveau:"pied",               // "pied" | "porte" | "installation"
  etage:"",                    // saisi par le client (min 1 compté en interne)
  trajetAller:true,trajetRetour:true,
  date:"",returnDate:"",
  items:{},options:{},freeText:"",
  deliveryKm:0,deliveryMin:0,addrStatus:"idle", // idle | checking | ok | error
  acomptePct:30
};

const T={
fr:{sub:"Demande de devis en ligne",s1:"Vos coordonnées",s2:"Date & Livraison",s3:"Votre matériel",s4:"Récapitulatif",
name:"Nom complet",phone:"Téléphone",email:"Email (optionnel)",address:"Adresse de livraison",
mode_liv:"Livraison",mode_ret:"Retrait entrepôt",
niv_pied:"Au pied du camion",niv_pied_sub:"Déchargement au niveau du véhicule",
niv_porte:"Devant votre porte",niv_porte_sub:"Nous montons jusqu'à votre étage",
niv_install:"Livraison + installation",niv_install_sub:"Montage et mise en place inclus",
etage_q:"À quel étage ?",etage_hint:"0 = rez-de-chaussée",
trajet:"Trajets",aller:"Aller uniquement",allerRetour:"Aller-retour",
date:"Date de livraison / retrait",retDate:"Date de retour",
items:"Choisissez vos articles",washing:"Option lavage",
calcul:"Calcul en cours...",addr_err:"Adresse non reconnue — les frais seront confirmés par nos soins.",
recap:"Récapitulatif",livraison:"Livraison",total:"Total",
acompte:"Acompte à payer",p30:"30% — réservation",p100:"100% — paiement complet",
acompte_note:"Vous recevrez les instructions de paiement par message après validation.",
submit:"Envoyer ma demande",next:"Suivant",back:"Retour",
ok_title:"Demande envoyée !",ok_text:"Nous avons bien reçu votre demande de devis. Notre équipe vous recontacte très rapidement pour la confirmer.",
req:"Merci de remplir les champs obligatoires",free_text:"Demande spéciale (optionnel)",free_text_ph:"Articles non listés, couleurs, précisions...",
ret_err:"La date de retour doit être postérieure à la date de livraison/retrait",
rue:"Numéro et rue",cp:"Code postal",ville:"Ville",
addr_incomplete:"Complétez le code postal et la ville pour calculer les frais",
cp_err:"Code postal invalide (5 chiffres attendus)",
hors_zone:"Adresse hors de notre zone de livraison — nous vous recontactons pour un devis personnalisé.",
frais_apres:"Frais de livraison confirmés par nos soins"},
en:{sub:"Online Quote Request",s1:"Your details",s2:"Date & Delivery",s3:"Your equipment",s4:"Summary",
name:"Full name",phone:"Phone",email:"Email (optional)",address:"Delivery address",
mode_liv:"Delivery",mode_ret:"Warehouse pickup",
niv_pied:"At the truck",niv_pied_sub:"Unloading at vehicle level",
niv_porte:"To your door",niv_porte_sub:"We carry up to your floor",
niv_install:"Delivery + setup",niv_install_sub:"Assembly and installation included",
etage_q:"Which floor?",etage_hint:"0 = ground floor",
trajet:"Trips",aller:"One way",allerRetour:"Round trip",
date:"Delivery / pickup date",retDate:"Return date",
items:"Choose your items",washing:"Washing option",
calcul:"Calculating...",addr_err:"Address not recognized — fees will be confirmed by our team.",
recap:"Summary",livraison:"Delivery",total:"Total",
acompte:"Deposit to pay",p30:"30% — reservation",p100:"100% — full payment",
acompte_note:"You will receive payment instructions by message after validation.",
submit:"Send my request",next:"Next",back:"Back",
ok_title:"Request sent!",ok_text:"We have received your quote request. Our team will contact you shortly to confirm it.",
req:"Please fill in the required fields",free_text:"Special request (optional)",free_text_ph:"Unlisted items, colors, details...",
ret_err:"Return date must be after the delivery/pickup date",
rue:"Street number and name",cp:"Postal code",ville:"City",
addr_incomplete:"Enter postal code and city to calculate delivery fees",
cp_err:"Invalid postal code (5 digits expected)",
hors_zone:"Address outside our delivery area — we will contact you with a custom quote.",
frais_apres:"Delivery fees confirmed by our team"}};
const t=k=>T[lang][k]||k;
window.toggleLang=()=>{lang=lang==="fr"?"en":"fr";document.getElementById("logo-sub").textContent=t("sub");render()};
const fmtD=d=>{if(!d)return"—";const p=d.split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d};
const TODAY=new Date().toISOString().slice(0,10);
const nextDay=d=>{if(!d)return TODAY;const dt=new Date(d);dt.setDate(dt.getDate()+1);return dt.toISOString().slice(0,10)};

async function loadData(){
  const[stockSnap,settingsSnap]=await Promise.all([getDocs(collection(db,"stock")),getDoc(doc(db,"app","settings"))]);
  stockItems=stockSnap.docs.map(d=>({...d.data(),id:d.id})).filter(s=>s.name&&(s.price||0)>0);
  settings=settingsSnap.exists()?(settingsSnap.data().value||settingsSnap.data()||{}):{};
  render();
}

async function computeDistance(origin,dest){
  if(!MAPS_KEY||!origin||!dest)return null;
  try{
    const resp=await fetch("https://routes.googleapis.com/distanceMatrix/v2:computeRouteMatrix",{
      method:"POST",headers:{"Content-Type":"application/json","X-Goog-Api-Key":MAPS_KEY,"X-Goog-FieldMask":"originIndex,destinationIndex,duration,distanceMeters,condition"},
      body:JSON.stringify({origins:[{waypoint:{address:origin}}],destinations:[{waypoint:{address:dest}}],travelMode:"DRIVE"})
    });
    if(!resp.ok)return null;
    const data=await resp.json();
    const el=Array.isArray(data)?data[0]:data;
    if(el&&el.condition==="ROUTE_EXISTS"&&el.distanceMeters!=null){
      const sec=parseInt(String(el.duration).replace("s",""))||0;
      return{km:Math.round(el.distanceMeters/100)/10,min:Math.round(sec/60)};
    }
  }catch(e){}
  return null;
}

// ─── Calculs de prix ───
function calcTrajetUnit(){
  const s=settings,km=form.deliveryKm,min=form.deliveryMin;
  if(km<=0)return 0;
  const forfait=s.minDeliveryPrice||0;
  const seuilKm=s.seuilKm!=null?s.seuilKm:5;
  const seuilMin=s.seuilMin!=null?s.seuilMin:0;
  return forfait+Math.max(0,km-seuilKm)*(s.pricePerKm||0)+Math.max(0,min-seuilMin)*(s.pricePerMin||0);
}
function calcBase(){ // livraison distance selon trajets
  const u=calcTrajetUnit();
  return(form.trajetAller?u:0)+(form.trajetRetour?u:0);
}
function effEtages(){ // étage saisi, min 1 en interne
  const e=parseInt(form.etage);
  return isNaN(e)||e<1?1:e;
}
function calcEtage(){ // barème étage × nb étages effectif
  const baremes=settings.deliveryEtageBaremes||{};
  const parEtage=Object.entries(form.items).filter(([,q])=>q>0).reduce((s,[id,qty])=>{
    const cfg=baremes[id];
    if(!cfg||!cfg.batchSize)return s;
    return s+Math.ceil(qty/(parseFloat(cfg.batchSize)||1))*(parseFloat(cfg.price)||0);
  },0);
  return parEtage*effEtages();
}
function calcInstall(){
  const baremes=settings.deliveryMiseEnPlaceBaremes||{};
  return Object.entries(form.items).filter(([,q])=>q>0).reduce((s,[id,qty])=>{
    const cfg=baremes[id];
    if(!cfg||!cfg.unitPrice)return s;
    return s+(parseFloat(cfg.unitPrice)||0)*qty;
  },0);
}
function calcDelivery(){ // prix total livraison selon niveau choisi
  if(form.mode!=="livraison")return 0;
  const base=calcBase();
  if(form.niveau==="pied")return base;
  if(form.niveau==="porte")return base+calcEtage();
  if(form.niveau==="installation")return base+calcEtage()+calcInstall();
  return base;
}
function delLabel(){
  if(form.niveau==="installation")return"🛠️ "+t("niv_install");
  if(form.niveau==="porte")return"🚪 "+t("niv_porte");
  return"🚚 "+t("niv_pied");
}
function calcSubtotal(){
  return Object.entries(form.items).reduce((s,[id,qty])=>{
    const item=stockItems.find(i=>i.id===id);
    if(!item||qty<=0)return s;
    const wash=form.options[id+"_washing"]?(parseFloat(item.cleaningPrice)||0)*qty:0;
    return s+(parseFloat(item.price)||0)*qty+wash;
  },0);
}
function calcTotal(){return calcSubtotal()+calcDelivery()}

// Distance maximale considérée comme une livraison normale. Au-delà, on n'annonce aucun prix
// (filet de sécurité contre une faute de frappe sur le code postal ou un client hors zone).
const MAX_KM=100;

// Adresse complète reconstituée à partir des 3 champs — utilisée pour l'API et pour Firestore.
function fullAddress(){
  const rue=(form.rue||"").trim(),cp=(form.cp||"").trim(),ville=(form.ville||"").trim();
  if(!rue||!cp||!ville)return"";
  return`${rue}, ${cp} ${ville}`;
}
const cpValide=()=>/^\d{5}$/.test((form.cp||"").trim());
const adresseComplete=()=>!!(form.rue||"").trim()&&cpValide()&&!!(form.ville||"").trim();

let debounceTimer=null;
// Jeton incrémenté à chaque nouvelle saisie : permet d'ignorer une réponse API qui reviendrait
// après qu'une saisie plus récente ait déjà lancé sa propre vérification (sinon une réponse
// "en retard" peut écraser un statut plus à jour et afficher un message erroné).
let addrReqToken=0;

// Appelé à chaque frappe sur l'un des 3 champs. Le calcul de distance n'est JAMAIS lancé tant
// que rue + code postal (5 chiffres) + ville ne sont pas tous renseignés : c'est ce qui évite
// que Google résolve une rue homonyme dans une autre ville et renvoie des frais aberrants.
window.onAddrField=(champ,val)=>{
  form[champ]=val;
  form.address=fullAddress();
  clearTimeout(debounceTimer);
  const myToken=++addrReqToken;
  if(!adresseComplete()){
    form.addrStatus="incomplete";form.deliveryKm=0;form.deliveryMin=0;
    updateAddrStatusDom();
    return;
  }
  form.addrStatus="checking";
  updateAddrStatusDom();
  debounceTimer=setTimeout(async()=>{
    const res=await computeDistance(settings.warehouseAddress||"",form.address);
    if(myToken!==addrReqToken)return; // réponse obsolète : une saisie plus récente a pris le relais
    if(res&&res.km>MAX_KM){form.deliveryKm=0;form.deliveryMin=0;form.addrStatus="horszone";}
    else if(res){form.deliveryKm=res.km;form.deliveryMin=res.min;form.addrStatus="ok";}
    else{form.deliveryKm=0;form.deliveryMin=0;form.addrStatus="error";}
    render();
  },900);
};

// Statut sous les champs adresse (couleur + texte) selon form.addrStatus. Appelé aussi en dehors
// de render() (frappe en cours) pour donner un retour immédiat sans reconstruire toute l'étape.
function addrStatusLabel(){
  if(form.addrStatus==="checking")return{text:"📍 "+t("calcul"),color:"#94a3b8"};
  if(form.addrStatus==="ok")return{text:`✅ ${form.ville.trim()} — ${t("recap")==="Récapitulatif"?"adresse validée":"address validated"}`,color:"#10b981"};
  if(form.addrStatus==="horszone")return{text:"📍 "+t("hors_zone"),color:"#f59e0b"};
  if(form.addrStatus==="error")return{text:"⚠️ "+t("addr_err"),color:"#f59e0b"};
  if(form.addrStatus==="incomplete")return{text:"✍️ "+t("addr_incomplete"),color:"#94a3b8"};
  return{text:"",color:"#94a3b8"};
}
function updateAddrStatusDom(){
  const el=document.getElementById("addr-status");
  if(!el)return;
  const{text,color}=addrStatusLabel();
  el.textContent=text;el.style.color=color;
}

function render(){
  const steps=[t("s1"),t("s2"),t("s3"),t("s4")];
  const bar=`<div class="step-bar">${steps.map((_,i)=>`<div class="${i<step-1?"done":i===step-1?"active":""}"></div>`).join("")}</div>`;

  // ── ÉTAPE 1 ──
  if(step===1){
    document.getElementById("app").innerHTML=`${bar}
    <div class="card"><h2>👤 ${t("s1")}</h2>
      <label>${t("name")} *</label><input id="f-name" value="${form.name}" placeholder="Prénom Nom" autocomplete="name"/>
      <label>${t("phone")} *</label><input id="f-phone" type="tel" value="${form.phone}" placeholder="+33 6 XX XX XX XX" autocomplete="tel"/>
      <label>${t("email")}</label><input id="f-email" type="email" value="${form.email}" placeholder="email@exemple.com" autocomplete="email"/>
      <div id="err1" class="err" style="display:none"></div>
      <button class="next-btn" style="width:100%" onclick="goStep1()">${t("next")} →</button>
    </div>`;
  }

  // ── ÉTAPE 2 ──
  else if(step===2){
    const hasAddr=form.addrStatus==="ok";
    // Les prix des niveaux ne sont PAS affichés ici : les surcoûts étage/installation dépendent
    // des articles (pas encore choisis à cette étape) — un prix identique sur les 3 niveaux
    // serait trompeur. Le prix final s'affiche au récapitulatif (étape 4).
    document.getElementById("app").innerHTML=`${bar}
    <div class="card"><h2>📅 ${t("s2")}</h2>
      <label>${t("date")} *</label>
      <input id="f-date" type="date" value="${form.date}" min="${TODAY}" onchange="onDateChange(this.value)"/>
      <label>${t("retDate")}</label>
      <input id="f-retdate" type="date" value="${form.returnDate}" min="${nextDay(form.date)}" onchange="onRetDateChange(this.value)"/>

      <label>Mode *</label>
      <div class="mode-grid">
        <button class="mode-card${form.mode==="livraison"?" sel":""}" onclick="setMode('livraison')"><div class="ic">🚚</div><div class="lb">${t("mode_liv")}</div></button>
        <button class="mode-card${form.mode==="retrait"?" sel":""}" onclick="setMode('retrait')"><div class="ic">🏠</div><div class="lb">${t("mode_ret")}</div></button>
      </div>

      ${form.mode==="livraison"?`
        <label>${t("address")} *</label>
        <input id="f-rue" value="${form.rue}" placeholder="${t("rue")}" autocomplete="street-address" oninput="onAddrField('rue',this.value)" style="margin-bottom:8px"/>
        <div class="addr-grid">
          <input id="f-cp" value="${form.cp}" placeholder="${t("cp")}" inputmode="numeric" maxlength="5" autocomplete="postal-code" oninput="onAddrField('cp',this.value)" style="margin-bottom:4px"/>
          <input id="f-ville" value="${form.ville}" placeholder="${t("ville")}" autocomplete="address-level2" oninput="onAddrField('ville',this.value)" style="margin-bottom:4px"/>
        </div>
        <div id="addr-status" style="font-size:12px;font-weight:700;color:${addrStatusLabel().color};margin-bottom:16px">${addrStatusLabel().text}</div>

        <label>${t("trajet")}</label>
        <div class="trajet-row">
          <button class="trajet-btn${form.trajetAller&&!form.trajetRetour?" sel":""}" onclick="setTrajet(true,false)">${t("aller")}</button>
          <button class="trajet-btn${form.trajetAller&&form.trajetRetour?" sel":""}" onclick="setTrajet(true,true)">${t("allerRetour")}</button>
        </div>

        <label>Niveau de service *</label>
        <div class="niveau-list">
          <button class="niveau-card${form.niveau==="pied"?" sel":""}" onclick="setNiveau('pied')">
            <div class="ic">🚚</div>
            <div class="info"><div class="ttl">${t("niv_pied")}</div><div class="sub">${t("niv_pied_sub")}</div></div>
            
          </button>
          <button class="niveau-card${form.niveau==="porte"?" sel":""}" onclick="setNiveau('porte')">
            <div class="ic">🚪</div>
            <div class="info"><div class="ttl">${t("niv_porte")}</div><div class="sub">${t("niv_porte_sub")}</div></div>
            
          </button>
          <button class="niveau-card${form.niveau==="installation"?" sel":""}" onclick="setNiveau('installation')">
            <div class="ic">🛠️</div>
            <div class="info"><div class="ttl">${t("niv_install")}</div><div class="sub">${t("niv_install_sub")}</div></div>
            
          </button>
        </div>

        ${form.niveau!=="pied"?`
        <div class="etage-row">
          <span>🪜 ${t("etage_q")}</span>
          <input type="number" inputmode="numeric" min="0" value="${form.etage}" placeholder="0" onchange="onEtageChange(this.value)"/>
          <span style="font-size:11px;color:var(--muted)">${t("etage_hint")}</span>
        </div>`:""}
      `:""}
      <div id="err2" class="err" style="display:none"></div>
      <div class="nav-btns"><button class="back-btn" onclick="goBackTo(1)">← ${t("back")}</button><button class="next-btn" onclick="goStep2()">${t("next")} →</button></div>
    </div>`;
  }

  // ── ÉTAPE 3 ──
  else if(step===3){
    const cats=[...new Set(stockItems.map(s=>s.category).filter(Boolean))].sort();
    let html=`${bar}<div class="card"><h2>📦 ${t("s3")}</h2>`;
    cats.forEach(cat=>{
      html+=`<div class="cat-title">${cat}</div>`;
      stockItems.filter(s=>s.category===cat).forEach(item=>{
        const qty=form.items[item.id]||0;
        const thumb=item.imageUrl?`<img src="${item.imageUrl}" class="item-thumb"/>`:`<div class="item-icon">${item.icon||"📦"}</div>`;
        const washPrice=parseFloat(item.cleaningPrice)||0;
        html+=`<div class="item-row">
          <div class="item-main">
            ${thumb}
            <div style="flex:1;min-width:0"><div class="item-name">${item.name}</div></div>
            <div class="qty-ctrl">
              <button class="qty-btn minus" onclick="setQty('${item.id}',${Math.max(0,qty-1)})">−</button>
              <input class="qty-input" type="number" inputmode="numeric" value="${qty}" min="0" onchange="setQty('${item.id}',parseInt(this.value)||0)"/>
              <button class="qty-btn plus" onclick="setQty('${item.id}',${qty+1})">+</button>
            </div>
          </div>
          ${qty>0&&washPrice>0?`<label class="opt-cb"><input type="checkbox" ${form.options[item.id+"_washing"]?"checked":""} onchange="toggleOpt('${item.id}_washing',this.checked)"/><span class="box"></span>🧺 ${t("washing")} +${washPrice.toFixed(2)} €/u</label>`:""}
        </div>`;
      });
    });
    html+=`<div style="margin-top:16px"><label>${t("free_text")}</label><textarea id="f-free" rows="3" placeholder="${t("free_text_ph")}" style="resize:vertical">${form.freeText||""}</textarea></div>`;
    html+=`<div class="nav-btns"><button class="back-btn" onclick="goBackTo(2)">← ${t("back")}</button><button class="next-btn" onclick="goStep3()">${t("next")} →</button></div></div>`;
    document.getElementById("app").innerHTML=html;
  }

  // ── ÉTAPE 4 ──
  else if(step===4){
    const total=calcTotal();
    const del=calcDelivery();
    const acompte=(total*form.acomptePct/100).toFixed(2);
    const selItems=Object.entries(form.items).filter(([,q])=>q>0);
    document.getElementById("app").innerHTML=`${bar}
    <div class="card"><h2>📋 ${t("recap")}</h2>
      <div style="margin-bottom:8px;font-size:15px"><strong>${form.name}</strong></div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:2px">${form.phone}${form.email?` · ${form.email}`:""}</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:2px">📅 ${fmtD(form.date)}${form.returnDate?" → "+fmtD(form.returnDate):""}</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:14px">${form.mode==="livraison"?`📍 ${fullAddress()||form.address}`:"🏠 "+t("mode_ret")}</div>
      ${selItems.map(([id,qty])=>{
        const it=stockItems.find(s=>s.id===id);
        if(!it)return"";
        const wash=form.options[id+"_washing"]?(parseFloat(it.cleaningPrice)||0)*qty:0;
        const tot=((parseFloat(it.price)||0)*qty)+wash;
        return`<div class="recap-row"><span>${it.icon||"📦"} ${it.name} ×${qty}${wash>0?" <span style='font-size:11px;color:#0891b2'>+ lavage</span>":""}</span><span style="font-weight:700">${tot.toFixed(2)} €</span></div>`;
      }).join("")}
      ${del>0?`<div class="recap-row"><span>${delLabel()}</span><span style="font-weight:700">${del.toFixed(2)} €</span></div>`:(form.mode==="livraison"&&form.addrStatus!=="ok"?`<div class="recap-row"><span>${delLabel()}</span><span style="font-weight:700;font-size:12px;color:#f59e0b">${t("frais_apres")}</span></div>`:"")}
      <div class="recap-total"><span>${t("total")}</span><span>${total.toFixed(2)} €</span></div>
      ${form.freeText?`<div style="background:#fffbeb;border-radius:10px;padding:12px;font-size:13px;margin-top:10px">📝 ${form.freeText}</div>`:""}
    </div>
    <div class="card"><h2>💰 ${t("acompte")}</h2>
      <div class="acompte-row">
        <button class="acompte-btn${form.acomptePct===30?" sel":""}" onclick="setPct(30)">30%<br><span style="font-size:17px;font-weight:900">${(total*.3).toFixed(2)} €</span></button>
        <button class="acompte-btn${form.acomptePct===100?" sel":""}" onclick="setPct(100)">100%<br><span style="font-size:17px;font-weight:900">${total.toFixed(2)} €</span></button>
      </div>
      <div style="text-align:center;font-size:12px;color:var(--muted)">${t("acompte_note")}</div>
    </div>
    <div id="err4" class="err" style="display:none"></div>
    <button class="submit-btn" id="submit-btn" onclick="submitForm()">✅ ${t("submit")}</button>
    <div class="nav-btns"><button class="back-btn" style="width:100%" onclick="goBackTo(3)">← ${t("back")}</button></div>`;
  }
}

// ── Handlers ──
window.onDateChange=v=>{
  form.date=v;
  // Si retour antérieur à la nouvelle date, proposer le lendemain
  if(form.returnDate&&form.returnDate<=v)form.returnDate=nextDay(v);
  render();
};
window.setMode=m=>{
  // Sauvegarder les dates avant re-render pour ne pas les perdre
  form.date=document.getElementById("f-date")?.value||form.date;
  form.returnDate=document.getElementById("f-retdate")?.value||form.returnDate;
  form.mode=m;
  render();
};
window.setTrajet=(a,r)=>{
  form.date=document.getElementById("f-date")?.value||form.date;
  form.returnDate=document.getElementById("f-retdate")?.value||form.returnDate;
  form.trajetAller=a;form.trajetRetour=r;render();
};
window.setNiveau=n=>{
  form.date=document.getElementById("f-date")?.value||form.date;
  form.returnDate=document.getElementById("f-retdate")?.value||form.returnDate;
  form.niveau=n;render();
};
window.setQty=(id,qty)=>{form.items[id]=Math.max(0,qty);render()};
window.toggleOpt=(k,v)=>{form.options[k]=v;render()};
window.setPct=p=>{form.acomptePct=p;render()};
window.saveFree=()=>{form.freeText=document.getElementById("f-free")?.value||form.freeText};

// ⚠️ Les handlers inline (onclick="...") s'exécutent dans le scope GLOBAL : ils ne voient pas
// les variables du module (step, form, render). Tout handler inline doit donc passer par une
// fonction exposée sur window — sinon il échoue silencieusement (cause du bug "bouton Retour
// inopérant" et "étage jamais pris en compte").
// Relit les 3 champs adresse depuis le DOM et reconstitue l'adresse complète.
function readAddrFields(){
  form.rue=document.getElementById("f-rue")?.value??form.rue;
  form.cp=document.getElementById("f-cp")?.value??form.cp;
  form.ville=document.getElementById("f-ville")?.value??form.ville;
  form.address=fullAddress();
}
window.goBackTo=n=>{
  // Sauvegarde les champs de l'étape courante avant de revenir en arrière
  if(step===2){
    form.date=document.getElementById("f-date")?.value||form.date;
    form.returnDate=document.getElementById("f-retdate")?.value||form.returnDate;
    if(form.mode==="livraison")readAddrFields();
  }
  if(step===3)saveFree();
  step=n;render();
};
window.onRetDateChange=v=>{form.returnDate=v};
window.onEtageChange=v=>{form.etage=v;render()};

window.goStep1=()=>{
  form.name=document.getElementById("f-name")?.value||"";
  form.phone=document.getElementById("f-phone")?.value||"";
  form.email=document.getElementById("f-email")?.value||"";
  const err=document.getElementById("err1");
  if(!form.name.trim()||!form.phone.trim()){err.textContent=t("req");err.style.display="block";return;}
  step=2;render();
};
window.goStep2=()=>{
  form.date=document.getElementById("f-date")?.value||form.date;
  form.returnDate=document.getElementById("f-retdate")?.value||form.returnDate;
  if(form.mode==="livraison")readAddrFields();
  const err=document.getElementById("err2");
  if(!form.date){err.textContent=t("req");err.style.display="block";return;}
  if(form.mode==="livraison"){
    // Les 3 champs sont obligatoires : sans code postal ni ville, la distance (et donc les frais)
    // ne peut pas être calculée de façon fiable.
    if(!form.rue.trim()||!form.ville.trim()){err.textContent=t("req");err.style.display="block";return;}
    if(!cpValide()){err.textContent=t("cp_err");err.style.display="block";return;}
  }
  // Garde-fou JS explicite : certains navigateurs (iOS Safari notamment) n'empêchent pas
  // toujours la sélection d'une date antérieure malgré l'attribut "min" du champ HTML.
  if(form.returnDate&&form.returnDate<=form.date){
    // Corrige automatiquement au lendemain de la date de livraison pour débloquer le client
    form.returnDate=nextDay(form.date);
    render();
    const err2=document.getElementById("err2");
    if(err2){err2.textContent=t("ret_err");err2.style.display="block";}
    return;
  }
  step=3;render();
};
window.goStep3=()=>{
  saveFree();
  const hasItems=Object.values(form.items).some(q=>q>0)||form.freeText.trim();
  if(!hasItems){alert(lang==="fr"?"Veuillez sélectionner au moins un article.":"Please select at least one item.");return;}
  step=4;render();
};

window.submitForm=async()=>{
  const btn=document.getElementById("submit-btn");
  btn.disabled=true;btn.textContent="⏳";
  try{
    const id="web-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,6);
    const items=Object.entries(form.items).filter(([,q])=>q>0).map(([itemId,qty])=>{
      const it=stockItems.find(s=>s.id===itemId);
      return{id:itemId,name:it?.name||itemId,icon:it?.icon||"📦",qty,price:parseFloat(it?.price)||0,category:it?.category||"",cleaningSelected:!!form.options[itemId+"_washing"],cleaningPrice:parseFloat(it?.cleaningPrice)||0};
    });
    const del=calcDelivery();
    await setDoc(doc(db,"orders",id),{
      id,status:"Non confirmé",phase:"livraison",
      clientName:form.name,clientPhone:form.phone,clientEmail:form.email,
      address:fullAddress()||form.address,addressRue:form.rue,addressCp:form.cp,addressVille:form.ville,deliveryMode:form.mode,
      deliveryNiveau:form.niveau,etageClient:form.etage,etageEffectif:form.mode==="livraison"&&form.niveau!=="pied"?effEtages():0,
      trajetAller:form.trajetAller,trajetRetour:form.trajetRetour,
      deliveryDate:form.date,returnDate:form.returnDate,
      deliveryKm:form.deliveryKm,deliveryMin:form.deliveryMin,
      deliveryPriceManual:del>0?String(del):"",
      items,freeTextRequest:form.freeText||"",notes:form.freeText||"",
      acompte:0,acomptePct:form.acomptePct,
      createdAt:new Date().toISOString(),createdBy:"web-client"
    });
    document.getElementById("app").innerHTML=`<div class="card success"><div class="ic">🎉</div><h2>${t("ok_title")}</h2><p>${t("ok_text")}</p></div>`;
    window.scrollTo(0,0);
    // Événement Facebook : demande de devis envoyée avec succès (utilisé pour le suivi des campagnes pub)
    if(typeof fbq==="function"){fbq('track','Lead');}
  }catch(e){
    btn.disabled=false;btn.textContent="✅ "+t("submit");
    const err=document.getElementById("err4");
    err.textContent="Erreur : "+e.message;err.style.display="block";
  }
};

loadData();
</script>
</body>
</html>
