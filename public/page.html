<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>EventDream</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
    :root{--cream:#FBF6EF;--panel:#F3E9DE;--ink:#3A2E26;--muted:#8A7A6D;--gold:#B8935A;--border:#E4D8C8}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',-apple-system,sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased}
    .serif{font-family:'Cormorant Garamond',serif}
    a{color:inherit}
    img{max-width:100%}
    .wrap{max-width:560px;margin:0 auto;padding:0 20px 40px}
    @media (min-width:700px){.wrap{max-width:760px}}

    .topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
    .topbar .logo{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;letter-spacing:.08em;text-decoration:none;color:var(--ink)}
    .back-link{font-size:12px;color:var(--muted);text-decoration:none;font-weight:600}

    .page-title{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;margin:18px 0 6px;line-height:1.1}
    .page-rule{width:56px;height:1px;background:var(--gold);margin-bottom:28px}

    .block{margin-bottom:32px}
    .hero-block .title{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;line-height:1.15}
    .hero-block .subtitle{color:var(--muted);font-size:14px;margin-top:8px;line-height:1.5}
    .hero-block img{width:100%;border-radius:16px;margin-top:14px;max-height:320px;object-fit:cover}

    .text-block .heading{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;margin-bottom:8px}
    .text-block .body{font-size:14px;line-height:1.75;color:#4a3d34;white-space:pre-line}

    .gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media (min-width:700px){.gallery-grid{grid-template-columns:repeat(3,1fr)}}
    .gallery-item{border-radius:14px;overflow:hidden;position:relative;background:var(--panel)}
    .gallery-item img{width:100%;height:180px;object-fit:cover;display:block}
    .gallery-caption{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to top,rgba(58,46,38,.75),transparent);color:#fff;font-size:11px;font-weight:600;padding:16px 10px 8px}

    .testi-grid{display:grid;grid-template-columns:1fr;gap:12px}
    @media (min-width:700px){.testi-grid{grid-template-columns:repeat(2,1fr)}}
    .testi-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px}
    .testi-stars{color:var(--gold);font-size:13px;margin-bottom:6px}
    .testi-text{font-size:13px;color:var(--ink);line-height:1.6;font-style:italic}
    .testi-name{font-size:11px;color:var(--muted);font-weight:700;margin-top:10px}

    .video-block video{width:100%;border-radius:16px;background:#000}

    .cta-block{background:var(--ink);border-radius:20px;padding:32px 24px;text-align:center}
    .cta-block .txt{color:var(--cream);font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;margin-bottom:16px}
    .cta-btn{display:inline-block;padding:14px 26px;border-radius:12px;background:var(--gold);color:var(--ink);font-weight:800;font-size:14px;text-decoration:none}

    /* ── Index du blog ── */
    .article-card{display:block;background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:12px;text-decoration:none;color:var(--ink)}
    .article-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600}
    .article-date{font-size:11px;color:var(--muted);margin-top:4px}
    .article-excerpt{font-size:13px;color:#4a3d34;margin-top:8px;line-height:1.5}

    .not-found{text-align:center;padding:60px 20px;color:var(--muted)}

    .wa-banner-link{display:block;text-align:center;background:#dcfce7;color:#065f46;border-radius:12px;padding:12px 14px;font-size:13px;font-weight:600;text-decoration:none;margin:32px 0 0}
    .wa-banner-link strong{font-weight:800}
    .site-footer{margin-top:36px;padding-top:20px;border-top:1px solid var(--border);text-align:center}
    .footer-nav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;margin-bottom:14px}
    .footer-nav a{font-size:12px;color:var(--muted);text-decoration:none;font-weight:600}
    .footer-copy{font-size:11px;color:#B8A99A}
  </style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a href="/accueil.html" class="logo serif">EVENTDREAM</a><a href="/accueil.html" class="back-link">← Accueil</a></div>
  <div id="app"><div style="text-align:center;padding:80px 0;color:#B8A99A">⏳</div></div>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getFirestore,doc,getDoc,collection,getDocs}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyD4WXB0wFeDtakmUC2uUGEeDutKlBuG8cU",authDomain:"eventdream-app.firebaseapp.com",projectId:"eventdream-app",storageBucket:"eventdream-app.firebasestorage.app",messagingSenderId:"881676818782",appId:"1:881676818782:web:77b339331ef984d25fd7cf"};
const db=getFirestore(initializeApp(cfg));

// SÉCURITÉ : même précaution que sur devis.html/confirm.html — tout texte affiché est échappé
// avant insertion dans le DOM (défense en profondeur, même si seul l'admin écrit ces pages).
function esc(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
const fmtD=d=>{if(!d)return"";const p=(d||"").split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d};

function waBannerHtml(settings){
  const tel=(settings.phone||"0652360849").replace(/[^0-9+]/g,"");
  const num=tel.replace(/^0/,"33").replace(/^\+/,"");
  return`<a href="https://wa.me/${num}" target="_blank" rel="noopener" class="wa-banner-link">💬 Une question ? Contactez-nous sur WhatsApp : <strong>${esc(settings.phone||"06 52 36 08 49")}</strong></a>`;
}

function renderBlock(b){
  if(b.type==="hero"){
    return`<div class="block hero-block">
      ${b.title?`<div class="title serif">${esc(b.title)}</div>`:""}
      ${b.subtitle?`<div class="subtitle">${esc(b.subtitle)}</div>`:""}
      ${b.image?`<img src="${esc(b.image)}"/>`:""}
    </div>`;
  }
  if(b.type==="text"){
    return`<div class="block text-block">
      ${b.heading?`<div class="heading serif">${esc(b.heading)}</div>`:""}
      <div class="body">${esc(b.body||"")}</div>
    </div>`;
  }
  if(b.type==="gallery"){
    const imgs=b.images||[];
    if(!imgs.length)return"";
    return`<div class="block"><div class="gallery-grid">${imgs.map(im=>`<div class="gallery-item"><img src="${esc(im.url)}" loading="lazy"/>${im.caption?`<div class="gallery-caption">${esc(im.caption)}</div>`:""}</div>`).join("")}</div></div>`;
  }
  if(b.type==="testimonials"){
    const items=(b.items||[]).filter(t=>t.text);
    if(!items.length)return"";
    return`<div class="block"><div class="testi-grid">${items.map(tm=>`<div class="testi-card"><div class="testi-stars">${"★".repeat(tm.rating||5)}</div><div class="testi-text">"${esc(tm.text)}"</div>${tm.name?`<div class="testi-name">— ${esc(tm.name)}</div>`:""}</div>`).join("")}</div></div>`;
  }
  if(b.type==="video"){
    if(!b.url)return"";
    return`<div class="block video-block"><video src="${esc(b.url)}" controls playsinline></video></div>`;
  }
  if(b.type==="cta"){
    return`<div class="block cta-block">
      ${b.text?`<div class="txt">${esc(b.text)}</div>`:""}
      <a href="${esc(b.buttonLink||"/devis.html")}" class="cta-btn">${esc(b.buttonText||"Demander un devis")} →</a>
    </div>`;
  }
  return"";
}

function footerHtml(allPages, currentId){
  const links=(allPages||[]).filter(p=>p.showInNav&&p.status==="published"&&p.id!==currentId);
  if(!links.length)return"";
  return`<div class="footer-nav">${links.map(p=>`<a href="/page.html?p=${encodeURIComponent(p.id)}">${esc(p.title)}</a>`).join("")}</div>`;
}

async function main(){
  const params=new URLSearchParams(window.location.search);
  const slug=params.get("p")||"";
  const [settingsSnap, allPagesSnap] = await Promise.all([
    getDoc(doc(db,"app","settings")),
    getDocs(collection(db,"pages")),
  ]);
  const settings=settingsSnap.exists()?(settingsSnap.data().value||{}):{};
  const allPages=allPagesSnap.docs.map(d=>({...d.data(),id:d.id}));

  if(!slug){
    document.getElementById("app").innerHTML=`<div class="not-found">Page introuvable.</div>`;
    return;
  }

  // ── Index automatique du blog ──
  if(slug==="blog"){
    const posts=allPages.filter(p=>p.isBlogPost&&p.status==="published").sort((a,b)=>(b.blogDate||"").localeCompare(a.blogDate||""));
    const excerptOf=p=>{
      const firstText=(p.blocks||[]).find(b=>b.type==="text"&&b.body);
      return firstText?firstText.body.slice(0,140)+(firstText.body.length>140?"…":""):"";
    };
    document.getElementById("app").innerHTML=`
      <div class="page-title serif">Blog</div><div class="page-rule"></div>
      ${posts.length?posts.map(p=>`<a class="article-card" href="/page.html?p=${encodeURIComponent(p.id)}">
        <div class="article-title serif">${esc(p.title)}</div>
        <div class="article-date">${fmtD(p.blogDate)}</div>
        ${excerptOf(p)?`<div class="article-excerpt">${esc(excerptOf(p))}</div>`:""}
      </a>`).join(""):`<div class="not-found">Aucun article pour l'instant.</div>`}
      <div class="site-footer">${footerHtml(allPages,slug)}<div class="footer-copy">EventDream — ${new Date().getFullYear()}</div></div>
      ${waBannerHtml(settings)}`;
    return;
  }

  // ── Page classique ──
  const page=allPages.find(p=>p.id===slug);
  if(!page||page.status!=="published"){
    document.getElementById("app").innerHTML=`<div class="not-found">Cette page n'existe pas ou n'est plus disponible.</div>`;
    return;
  }
  document.title=`${page.title} — EventDream`;
  document.getElementById("app").innerHTML=`
    ${page.isBlogPost?`<div class="back-link" style="margin-bottom:8px"><a href="/page.html?p=blog" style="color:var(--muted);text-decoration:none">← Blog</a></div>`:""}
    <div class="page-title serif">${esc(page.title)}</div>
    ${page.isBlogPost&&page.blogDate?`<div style="font-size:12px;color:var(--muted);margin-bottom:20px">${fmtD(page.blogDate)}</div>`:`<div class="page-rule"></div>`}
    ${(page.blocks||[]).map(renderBlock).join("")}
    <div class="site-footer">${footerHtml(allPages,slug)}<div class="footer-copy">EventDream — ${new Date().getFullYear()}</div></div>
    ${waBannerHtml(settings)}`;
}

main().catch(e=>{
  console.error(e);
  document.getElementById("app").innerHTML=`<div class="not-found">Une erreur est survenue. Réessayez plus tard.</div>`;
});
</script>
</body>
</html>
